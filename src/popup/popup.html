<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <script src="../theme-early.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QRify</h1>
            <button id="theme-toggle" class="theme-toggle"></button>
        </div>
        <div class="input-section">
            <input type="text" id="qr-text" data-i18n-placeholder="textPlaceholder">
            <button id="generate-btn" data-i18n="generate"></button>
            <button id="current-url-btn" data-i18n="currentUrl"></button>
        </div>
        <div class="style-section">
            <div class="color-picker">
                <label><span data-i18n="qrColor"></span>
                    <input type="color" id="qr-color" value="#000000">
                </label>
                <label><span data-i18n="bgColor"></span>
                    <input type="color" id="bg-color" value="#ffffff">
                </label>
            </div>
            <div class="size-picker">
                <label><span data-i18n="size"></span>
                    <select id="qr-size">
                        <option value="64" data-i18n="sizeExtraSmall"></option>
                        <option value="128" selected data-i18n="sizeSmall"></option>
                        <option value="256" data-i18n="sizeMedium"></option>
                        <option value="512" data-i18n="sizeLarge"></option>
                    </select>
                </label>
            </div>
        </div>
        <div class="qr-section">
            <div id="qr-code"></div>
            <div class="button-group">
                <button id="download-btn" class="hidden" data-i18n="download"></button>
                <button id="share-btn" class="hidden" data-i18n="share"></button>
            </div>
        </div>
    </div>
    <script src="popup.js" type="module"></script>
</body>
</html>
